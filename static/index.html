<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSAR Approval Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .dashboard {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dashboard h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .queue-list {
            display: grid;
            gap: 20px;
        }

        .queue-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .queue-item:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }

        .queue-item.approved {
            background: #e8f5e9;
            opacity: 0.7;
        }

        .queue-item.denied {
            background: #ffebee;
            opacity: 0.7;
        }

        .item-header {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 20px;
            margin-bottom: 15px;
            align-items: start;
        }

        .item-details {
            display: grid;
            gap: 12px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
            font-size: 14px;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
        }

        .detail-value {
            color: #333;
        }

        .delivery-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .delivery-section h4 {
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .delivery-item {
            display: grid;
            grid-template-columns: 120px 1fr 80px;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            font-size: 13px;
        }

        .delivery-type {
            font-weight: 600;
            color: #333;
        }

        .delivery-timestamp {
            color: #666;
        }

        .delivery-status-badge {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }

        .risk-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .risk-high {
            background: #ffcdd2;
            color: #c62828;
        }

        .risk-medium {
            background: #fff3e0;
            color: #e65100;
        }

        .risk-low {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-approved {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status-denied {
            background: #ffcdd2;
            color: #c62828;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-approve {
            background: #4caf50;
            color: white;
        }

        .btn-approve:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
        }

        .btn-deny {
            background: #f44336;
            color: white;
        }

        .btn-deny:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(244, 67, 54, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .item-header {
                grid-template-columns: 1fr;
            }

            .delivery-item {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔐 DSAR Approval Dashboard</h1>
            <p>Review and approve pending Data Subject Access Requests</p>

            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="total-pending">0</div>
                    <div class="label">Pending Reviews</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="total-approved">0</div>
                    <div class="label">Approved</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="total-delivered">0</div>
                    <div class="label">Delivered</div>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <h2>Approval Queue & Delivery Status</h2>
            <div id="alerts"></div>
            <div id="queue-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading pending requests...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hyeyyduurqrsmdpztffh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZXl5ZHV1cnFyc21kcHp0ZmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMDg5NjcsImV4cCI6MjEwNjU4NDk2N30.PydqFgv853Mt152yKDP8zV1F5LIqorTGE46199acIMI';

        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            loadApprovalQueue();
            setInterval(loadApprovalQueue, 5000);
        });

        async function loadApprovalQueue() {
            try {
                const { data, error } = await supabaseClient
                    .from('approval_queue')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                for (let item of data || []) {
                    const { data: deliveries } = await supabaseClient
                        .from('dsar_deliveries')
                        .select('*')
                        .eq('dsar_id', item.dsar_id);
                    item.deliveries = deliveries || [];
                }

                renderQueue(data || []);
                updateStats(data || []);
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        function renderQueue(items) {
            const container = document.getElementById('queue-container');

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>✅ All caught up!</h3><p>No pending requests.</p></div>';
                return;
            }

            container.innerHTML = `<div class="queue-list">${items.map(item => renderQueueItem(item)).join('')}</div>`;

            items.forEach(item => {
                document.getElementById(`approve-${item.id}`)?.addEventListener('click', () => approveRequest(item.id));
                document.getElementById(`deny-${item.id}`)?.addEventListener('click', () => denyRequest(item.id));
            });
        }

        function renderQueueItem(item) {
            const riskClass = `risk-${(item.risk_level || 'high').toLowerCase()}`;
            const statusClass = `status-${item.status}`;
            const pdfDelivery = (item.deliveries || []).find(d => d.delivery_type === 'pdf');
            const passwordDelivery = (item.deliveries || []).find(d => d.delivery_type === 'password');
            const isProcessing = item.status !== 'pending';

            const deliveryHTML = (pdfDelivery || passwordDelivery) ? `
                <div class="delivery-section">
                    <h4>📧 Delivery Status</h4>
                    ${pdfDelivery ? `<div class="delivery-item"><span class="delivery-type">📄 PDF</span><span class="delivery-timestamp">${new Date(pdfDelivery.sent_at).toLocaleString()}</span><span class="delivery-status-badge">sent</span></div>` : ''}
                    ${passwordDelivery ? `<div class="delivery-item"><span class="delivery-type">🔑 Password</span><span class="delivery-timestamp">${new Date(passwordDelivery.sent_at).toLocaleString()}</span><span class="delivery-status-badge">sent</span></div>` : ''}
                </div>
            ` : '';

            return `
                <div class="queue-item ${item.status}">
                    <div class="item-header">
                        <div class="item-details">
                            <div class="detail-row"><span class="detail-label">ID</span><span class="detail-value"><code>${item.dsar_id.substring(0, 8)}</code></span></div>
                            <div class="detail-row"><span class="detail-label">Risk</span><span class="detail-value"><span class="risk-badge ${riskClass}">${item.risk_level}</span></span></div>
                            <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value"><span class="status-badge ${statusClass}">${item.status}</span></span></div>
                            <div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${item.notes || 'None'}</span></div>
                        </div>
                        ${!isProcessing ? `
                            <div class="actions">
                                <button class="btn-approve" id="approve-${item.id}">✓ Approve</button>
                                <button class="btn-deny" id="deny-${item.id}">✗ Deny</button>
                            </div>
                        ` : ''}
                    </div>
                    ${deliveryHTML}
                </div>
            `;
        }

        async function approveRequest(queueId) {
            if (!confirm('Approve this DSAR?')) return;
            try {
                await supabaseClient.from('approval_queue').update({ status: 'approved', updated_at: new Date().toISOString() }).eq('id', queueId);
                showAlert('✅ Approved!', 'success');
                loadApprovalQueue();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function denyRequest(queueId) {
            const reason = prompt('Reason:');
            if (!reason) return;
            try {
                await supabaseClient.from('approval_queue').update({ status: 'denied', notes: reason, updated_at: new Date().toISOString() }).eq('id', queueId);
                showAlert('❌ Denied!', 'success');
                loadApprovalQueue();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        function updateStats(items) {
            document.getElementById('total-pending').textContent = items.filter(i => i.status === 'pending').length;
            document.getElementById('total-approved').textContent = items.filter(i => i.status === 'approved').length;
            document.getElementById('total-delivered').textContent = items.filter(i => i.deliveries?.length > 0).length;
        }

        function showAlert(message, type) {
            const alertId = 'alert-' + Date.now();
            document.getElementById('alerts').innerHTML += `<div class="alert alert-${type}" id="${alertId}">${message}</div>`;
            setTimeout(() => document.getElementById(alertId)?.remove(), 5000);
        }
    </script>
</body>

</html>
